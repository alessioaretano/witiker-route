<title>BYU Witikon – Route Reveal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
  #map { width: 100%; height: 100%; }
  .leaflet-container { background: #0a0a0a; }
  .leaflet-control-attribution,
  .leaflet-control-zoom { display: none !important; }

  #routeCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 500;
  }
  #vignette {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 600;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.65) 100%);
  }
  #ui {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 700;
    font-family: 'Montserrat', Impact, sans-serif;
  }
  #title {
    position: absolute; top: 28px; left: 30px;
    font-size: 10px; font-weight: 900;
    letter-spacing: 5px; color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    opacity: 0; transition: opacity 1s;
  }
  #title.on { opacity: 1; }
  #counter {
    position: absolute; top: 24px; right: 30px;
    text-align: right; color: #C3FF00;
    opacity: 0; transition: opacity 0.6s;
  }
  #counter.on { opacity: 1; }
  #counter .lbl { display: block; font-size: 9px; letter-spacing: 3px; color: rgba(195,255,0,0.5); margin-bottom: 2px; }
  #counter .val { font-size: 28px; font-weight: 900; letter-spacing: 1px; line-height: 1; }

  #startBtn {
    position: absolute; bottom: 40px; left: 50%;
    transform: translateX(-50%); z-index: 800;
    background: transparent;
    border: 2px solid #C3FF00;
    color: #C3FF00;
    font-family: 'Montserrat', Impact, sans-serif;
    font-weight: 900; font-size: 12px;
    letter-spacing: 5px; text-transform: uppercase;
    padding: 13px 38px; cursor: pointer;
    transition: all 0.2s;
  }
  #startBtn:hover { background: #C3FF00; color: #000; }
  #startBtn.gone { opacity: 0; pointer-events: none; transition: opacity 0.4s; }

// ── MAP ───────────────────────────────────────────────────────────────────────
const map = L.map('map', {
  zoomControl: false, attributionControl: false,
  dragging: false, touchZoom: false, scrollWheelZoom: false,
  doubleClickZoom: false, keyboard: false
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  maxNativeZoom: 19,
  tileSize: 256,
  detectRetina: true
}).addTo(map);

const latLngs = COORDS.map(c => L.latLng(c[0], c[1]));
// fitBounds first, then enforce minimum zoom for sharp tiles
map.fitBounds(L.latLngBounds(latLngs), { padding: [55, 55] });
if (map.getZoom() < 14) map.setZoom(14);

// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('routeCanvas');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
const ctx = canvas.getContext('2d');

function px(lat, lon) {
  const p = map.latLngToContainerPoint(L.latLng(lat, lon));
  return [p.x, p.y];
}

function drawGlow(pts) {
  if (pts.length < 2) return;
  const layers = [
    { width: 28, color: 'rgba(195,255,0,0.06)' },
    { width: 16, color: 'rgba(195,255,0,0.15)' },
    { width: 8,  color: 'rgba(195,255,0,0.35)' },
    { width: 3,  color: '#C3FF00' },
  ];
  layers.forEach(({ width, color }) => {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  });
  // Tip spark
  const [tx, ty] = pts[pts.length - 1];
  const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, 20);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(195,255,0,0.9)');
  g.addColorStop(1,   'rgba(195,255,0,0)');
  ctx.beginPath();
  ctx.arc(tx, ty, 20, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawFlag() {
  const [x, y] = px(COORDS[0][0], COORDS[0][1]);
  ctx.save();
  ctx.shadowColor = '#C3FF00';
  ctx.shadowBlur = 16;
  ctx.font = '22px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏁', x, y);
  ctx.restore();
}

// ── ANIMATION ─────────────────────────────────────────────────────────────────
let running = false;
let progress = 1;
const SPEED  = 1.1;

function frame() {
  if (!running) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const idx  = Math.min(Math.floor(progress), COORDS.length - 1);
  const drawn = COORDS.slice(0, idx + 1).map(c => px(c[0], c[1]));
  drawFlag();
  drawGlow(drawn);
  const pct = Math.round((progress / (COORDS.length - 1)) * 100);
  document.getElementById('pctVal').textContent = Math.min(pct, 100) + '%';
  if (progress < COORDS.length - 1) {
    progress += SPEED;
    requestAnimationFrame(frame);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFlag();
    drawGlow(COORDS.map(c => px(c[0], c[1])));
    document.getElementById('pctVal').textContent = '100%';
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startBtn').classList.add('gone');
  document.getElementById('counter').classList.add('on');
  document.getElementById('title').classList.add('on');
  setTimeout(() => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFlag();
    running = true;
    progress = 1;
    requestAnimationFrame(frame);
  }, 400);
});

map.whenReady(() => {
  setTimeout(() => {
    drawFlag();
    document.getElementById('title').classList.add('on');
  }, 900);
});
